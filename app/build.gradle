plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.stlslicer.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stlslicer.app'
        minSdk 24
        targetSdk 28
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
