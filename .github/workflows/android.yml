name: Build STL Slicer APK

on:
  push:
    branches: [main, feature/offline-slicer-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download stable AOSP test signing key
        run: |
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.pk8?format=TEXT' | base64 -d > testkey.pk8
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.x509.pem?format=TEXT' | base64 -d > testkey.x509.pem
          test -s testkey.pk8
          test -s testkey.x509.pem

      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon

      - name: Align and sign APK with stable update key
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --key testkey.pk8 \
            --cert testkey.x509.pem \
            --out app/build/outputs/apk/release/STL-Slicer-3D.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/STL-Slicer-3D.apk

      - name: Show APK version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            app/build/outputs/apk/release/STL-Slicer-3D.apk | head -n 2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STL-Slicer-3D-APK
          path: app/build/outputs/apk/release/STL-Slicer-3D.apk
