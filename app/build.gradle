plugins {
    id 'com.android.application' version '8.7.3'
}

def ciBuildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.stlslicer.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stlslicer.app'
        minSdk 24
        targetSdk 35
        versionCode 1000 + ciBuildNumber
        versionName "1.2.${ciBuildNumber}"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
